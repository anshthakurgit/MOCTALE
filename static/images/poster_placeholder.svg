    <circle r="44" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8" />
    <circle r="14" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="-26" r="6" fill="#c5a77b" opacity="0.5" />
    <circle cx="26" cy="0" r="6" fill="#c5a77b" opacity="0.5" />
    <circle cx="0" cy="26" r="6" fill="#c5a77b" opacity="0.5" />
    <circle cx="-26" cy="0" r="6" fill="#c5a77b" opacity="0.5" />
  </g>
  
  <text x="250" y="430" fill="#F5F1E8" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" letter-spacing="4" text-anchor="middle" opacity="0.9">MOCTALE</text>
  <text x="250" y="460" fill="#A4A09A" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" letter-spacing="2" text-anchor="middle" opacity="0.6">CINEMA ARCHIVE</text>

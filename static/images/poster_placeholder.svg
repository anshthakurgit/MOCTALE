<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0c0c0c" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2c99f" />
      <stop offset="100%" stop-color="#c5a77b" />
    </linearGradient>
  </defs>
  <rect width="500" height="750" fill="url(#bg)" />
  <rect x="20" y="20" width="460" height="710" fill="none" stroke="#252525" stroke-width="1.5" />
  
  <!-- Film reel icon -->

services:
  - type: web
    name: moctale-movie-recommender
    runtime: python
    buildCommand: "pip install -r requirements.txt && python src/build_model.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: TMDB_API_KEY
        value: false
      - key: TMDB_ACCESS_TOKEN
        value: false
